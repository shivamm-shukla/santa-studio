<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Santa Studio{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/logo/santa-studio-logo.svg">
</head>
<body class="bg-white text-ink min-h-screen flex flex-col">
  <header class="border-b border-ink/10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <img src="/static/logo/santa-studio-logo.svg" alt="Santa Studio" class="w-8 h-8 brand-mark">
        <span class="text-lg font-extrabold tracking-tight">Santa Studio</span>
      </a>
      <nav class="flex items-center gap-7 text-sm font-semibold">
        <a href="/" class="nav-link hover:text-accent transition-colors">Dashboard</a>
        <a href="/voice-studio" class="nav-link hover:text-accent transition-colors">Voice Studio</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-ink/10 py-6">
    <div class="max-w-5xl mx-auto px-6 text-xs text-ink/40">
      Santa Studio — your AI content studio
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
