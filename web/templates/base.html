<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Santa Studio{% endblock %}</title>
  <script>
    /* Before anything paints. Reading the stored choice after the stylesheet
       has already drawn a dark page means a white flash on every navigation
       for anyone who turned the lights on. The key is shared with the room,
       so the switch follows you between them. */
    (function () {
      try {
        var saved = localStorage.getItem('santa-studio-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) { /* private window, or storage refused - dark is fine */ }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/logo/santa-studio-logo.svg">
</head>
<body class="min-h-screen flex flex-col">
  <header>
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2.5">
        <img src="/static/logo/santa-studio-logo.svg" alt="" class="w-8 h-8 brand-mark">
        <span class="text-lg font-extrabold tracking-tight">Santa Studio</span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-semibold">
        <a href="/dashboard" class="nav-link {% block nav_dashboard %}{% endblock %}">Dashboard</a>
        <a href="/clips" class="nav-link {% block nav_clips %}{% endblock %}">Clips</a>
        <a href="/voice-studio" class="nav-link {% block nav_voice %}{% endblock %}">Voice</a>
        <a href="/room/" class="nav-link">The Room</a>
        <button class="lights" id="lights" type="button" aria-live="polite">
          <span class="bulb"></span><span id="lights-label">Lights on</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-6" style="border-top: 1px solid var(--border)">
    <div class="max-w-5xl mx-auto px-6 text-xs" style="color: var(--faint)">
      Santa Studio
    </div>
  </footer>

  <script>
    (function () {
      var button = document.getElementById('lights');
      var label = document.getElementById('lights-label');

      function paint() {
        var light = document.documentElement.dataset.theme === 'light';
        // Named for what pressing it does, not for what is currently on.
        label.textContent = light ? 'Lights off' : 'Lights on';
      }

      button.addEventListener('click', function () {
        var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('santa-studio-theme', next); } catch (e) {}
        paint();
      });

      paint();
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
